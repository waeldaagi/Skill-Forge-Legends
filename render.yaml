# Blueprint Render : la base PostgreSQL et le service web de SkillForge (voir DEPLOY.md).
databases:
  - name: skillforge-db
    plan: free
    region: frankfurt
    databaseName: skillforge
    user: skillforge

services:
  - type: web
    name: skillforge
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: ./build.sh
    startCommand: python -m gunicorn config.wsgi:application
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DATABASE_URL
        fromDatabase:
          name: skillforge-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # 512 Mo de mémoire sur l'offre gratuite : deux processus gunicorn au plus.
      - key: WEB_CONCURRENCY
        value: 2
      # Pas de worker Celery sur l'offre gratuite : les tâches tournent dans le processus web.
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: SERVE_MEDIA
        value: "True"
      - key: AI_PROVIDER
        value: mock
      - key: AI_API_KEY
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
