{% extends "base.html" %}

{% block title %}Connexion · SkillForge{% endblock %}

{% block content %}
<div class="sf-narrow">
  <h1>Connexion</h1>
  <form method="post" action="{% url 'accounts:login' %}">
    {% csrf_token %}
    {{ form }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary">Se connecter</button>
  </form>
  <p class="mt-3"><a href="{% url 'accounts:password_reset' %}">Mot de passe oublié ?</a></p>
  <p class="mt-3">
    Vous n’avez pas encore de compte ?
    <a href="{% url 'accounts:register' %}">Créer un compte</a>
  </p>
</div>
{% endblock %}
