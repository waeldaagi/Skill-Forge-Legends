{% extends "base.html" %}

{% block title %}Créer un compte · SkillForge{% endblock %}

{% block content %}
<div class="sf-narrow">
  <h1>Créer un compte</h1>
  <p>Choisissez le rôle qui correspond à votre usage de SkillForge.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form }}
    <button class="btn sf-btn-primary" type="submit">Créer mon compte</button>
  </form>
  <p class="mt-3">
    Vous avez déjà un compte ?
    <a href="{% url 'accounts:login' %}">Se connecter</a>
  </p>
</div>
{% endblock %}
