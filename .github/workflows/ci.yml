name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: skillforge
          POSTGRES_USER: skillforge
          POSTGRES_PASSWORD: skillforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://skillforge:skillforge@localhost:5432/skillforge
      REDIS_URL: redis://localhost:6379/0
      AI_PROVIDER: mock

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run

      - name: Tests et couverture
        run: pytest --cov --cov-report=term --cov-report=html --cov-fail-under=75

      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov/
