{% extends "base.html" %}
{% block title %}Recherche talents{% endblock %}
{% block content %}
<h1>Recherche de talents</h1>
<form method="get" class="mb-3">
  {{ form }}
  <button type="submit" class="btn btn-primary">Rechercher</button>
</form>
<ul class="list-group">
  {% for learner in learners %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
      <span>{{ learner }}</span>
      <a href="{% url 'assessment:talent_profile' learner.pk %}">Voir profil</a>
    </li>
  {% empty %}
    <li class="list-group-item">Aucun talent trouvé.</li>
  {% endfor %}
</ul>
{% endblock %}
