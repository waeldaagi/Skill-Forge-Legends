{% extends "base.html" %}
{% block title %}{{ page_title }} · SkillForge{% endblock %}
{% block content %}
<h1>{{ page_title }}</h1>
<p><strong>{{ object }}</strong></p>
<p>{{ warning }} Cette action est définitive.</p>
<form method="post">
  {% csrf_token %}
  <div class="d-flex flex-wrap gap-2">
    <button class="btn btn-danger" type="submit">{{ submit_label }}</button>
    <a class="btn btn-outline-secondary" href="{{ cancel_url }}">Annuler</a>
  </div>
</form>
{% endblock %}
