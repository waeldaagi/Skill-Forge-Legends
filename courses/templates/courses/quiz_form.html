{% extends "base.html" %}
{% block title %}{{ page_title }} · SkillForge{% endblock %}
{% block content %}
<h1>{{ page_title }}</h1>
<form method="post">
  {% csrf_token %}
  {{ form }}
  <div class="d-flex flex-wrap gap-2 mt-3">
    <button class="btn sf-btn-primary" type="submit">Enregistrer le quiz</button>
    {% if cancel_url %}<a class="btn btn-outline-secondary" href="{{ cancel_url }}">Annuler</a>{% endif %}
  </div>
</form>
{% endblock %}
